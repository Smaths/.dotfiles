[tools]
go = "1.27.1"
node = "26.10.0"
pi = "1.4"
pnpm = "12.11.2"

[settings]
# Honor project-native Node.js and pnpm version declarations. Go uses the
# global pin unless a project explicitly provides its own mise configuration.
idiomatic_version_file_enable_tools = ["node", "pnpm"]
paranoid = true
