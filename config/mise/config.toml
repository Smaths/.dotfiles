[tools]
# Follow the newest release of Go, Node.js, and pnpm. Pi stays on 1.5.x.
# Projects can select their own versions.
go = "latest"
node = "latest"
pi = "1.5"
pnpm = "latest"

[settings]
# Honor project-native Node.js and pnpm version declarations. Go uses the
# global version unless a project provides its own mise configuration or a
# go.mod toolchain directive.
idiomatic_version_file_enable_tools = ["node", "pnpm"]
paranoid = true
