[tools]
# Track the newest release of each tool. mise resolves "latest" to the newest
# installed version, so nothing changes until `mise upgrade` (or `mise install`
# on a fresh machine) fetches a newer one. Projects pin their own versions.
go = "latest"
node = "latest"
pi = "latest"
pnpm = "latest"

[settings]
# Honor project-native Node.js and pnpm version declarations. Go uses the
# global version unless a project provides its own mise configuration or a
# go.mod toolchain directive.
idiomatic_version_file_enable_tools = ["node", "pnpm"]
paranoid = true
