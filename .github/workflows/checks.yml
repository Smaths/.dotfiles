name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Validation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install shell tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends jq shellcheck zsh

          # Noble's shfmt cannot parse the repo's Zsh files. Use the pinned
          # upstream release so local and CI formatting rules agree.
          tools_dir="$RUNNER_TEMP/shell-tools"
          mkdir -p "$tools_dir"
          curl --fail --location --retry 3 --retry-delay 2 \
            --output "$tools_dir/shfmt" \
            https://github.com/mvdan/sh/releases/download/v3.14.0/shfmt_v3.14.0_linux_amd64
          echo 'fe42021c7272ef2d67ea36cbc3031683c625d0badec733ef3a57b567246a0b66  shfmt' \
            | (cd "$tools_dir" && sha256sum --check --status -)
          chmod +x "$tools_dir/shfmt"
          echo "$tools_dir" >> "$GITHUB_PATH"
          "$tools_dir/shfmt" --version
      - name: Run checks
        run: bash tests/check.sh

  debian:
    name: Bootstrap (${{ matrix.image }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        image:
          - 'debian:13-slim'
          - 'debian:12-slim'
          - 'ubuntu:26.04'
          - 'ubuntu:24.04'
          - 'ubuntu:22.04'
    steps:
      - uses: actions/checkout@v4

      - name: Install and rerun in a clean container
        run: |
          docker run --rm --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/checkout,readonly" \
            "${{ matrix.image }}" bash /checkout/tests/install/debian_smoke_test.sh

  windows:
    name: Windows PowerShell validation
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Validate with Windows PowerShell 5.1
        shell: powershell
        run: .\tests\windows\check.ps1

      - name: Validate with PowerShell 7
        shell: pwsh
        run: ./tests/windows/check.ps1
