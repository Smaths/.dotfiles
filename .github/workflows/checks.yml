name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Validation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install shell tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck zsh

          # Noble's shfmt cannot parse the repo's Zsh files. Use the pinned
          # upstream release so local and CI formatting rules agree.
          tools_dir="$RUNNER_TEMP/shell-tools"
          mkdir -p "$tools_dir"
          curl --fail --location --retry 3 --retry-delay 2 \
            --output "$tools_dir/shfmt" \
            https://github.com/mvdan/sh/releases/download/v3.14.0/shfmt_v3.14.0_linux_amd64
          echo 'fe42021c7272ef2d67ea36cbc3031683c625d0badec733ef3a57b567246a0b66  shfmt' \
            | (cd "$tools_dir" && sha256sum --check --status -)
          chmod +x "$tools_dir/shfmt"
          echo "$tools_dir" >> "$GITHUB_PATH"
          "$tools_dir/shfmt" --version
      - name: Run checks
        run: bash tests/check.sh

      - name: Run Debian dry-run
        run: |
          mkdir -p "$RUNNER_TEMP/dotfiles-home"
          HOME="$RUNNER_TEMP/dotfiles-home" DOTFILES_DIR="$GITHUB_WORKSPACE" sh install/bootstrap.sh --dry-run --skip-packages

  windows:
    name: Windows PowerShell validation
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Validate with Windows PowerShell 5.1
        shell: powershell
        run: .\tests\windows\check.ps1

      - name: Validate with PowerShell 7
        shell: pwsh
        run: ./tests/windows/check.ps1
